name: Generator Windows

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Build token (from Everty Desk server)'
        required: true
        type: string
      genurl:
        description: 'Everty Desk API server base URL'
        required: false
        type: string

env:
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.19.6"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  TAG_NAME: "nightly"

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout RustDesk
        uses: actions/checkout@v4

      - name: Fetch build params from Everty Desk
        id: params
        shell: bash
        run: |
          GENURL="${{ inputs.genurl || secrets.GENURL }}"
          TOKEN="${{ inputs.token }}"

          echo "Fetching params from ${GENURL}/admin/client-build/get-params?token=${TOKEN}"
          RESPONSE=$(curl -s -f "${GENURL}/admin/client-build/get-params?token=${TOKEN}")
          if [ $? -ne 0 ]; then
            echo "Failed to fetch build params"
            exit 1
          fi

          echo "APP_NAME=$(echo $RESPONSE | jq -r '.app_name')" >> $GITHUB_ENV
          echo "COMPANY_NAME=$(echo $RESPONSE | jq -r '.company_name')" >> $GITHUB_ENV
          echo "FILE_NAME=$(echo $RESPONSE | jq -r '.file_name')" >> $GITHUB_ENV
          echo "RDSERVER=$(echo $RESPONSE | jq -r '.server')" >> $GITHUB_ENV
          echo "RDKEY=$(echo $RESPONSE | jq -r '.key')" >> $GITHUB_ENV
          echo "API_SERVER=$(echo $RESPONSE | jq -r '.api_server')" >> $GITHUB_ENV
          echo "CUSTOM_TXT=$(echo $RESPONSE | jq -r '.custom')" >> $GITHUB_ENV
          echo "BUILD_TOKEN=${TOKEN}" >> $GITHUB_ENV
          echo "GENURL_VALUE=${GENURL}" >> $GITHUB_ENV

      - name: Report status - running
        shell: bash
        run: |
          curl -s -X POST "${GENURL_VALUE}/admin/client-build/webhook/update?token=${BUILD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"running\",\"run_id\":${GITHUB_RUN_ID},\"progress\":\"Установка зависимостей...\"}"

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "b5ec7f26c7ad1e6c89b7bc14c8da78069e5b88e6"

      - name: Install vcpkg packages
        run: |
          vcpkg install --triplet x64-windows-static libvpx libyuv opus aom

      - name: Write custom.txt
        shell: bash
        run: |
          echo "${CUSTOM_TXT}" > src/custom.txt
          echo "custom.txt content:"
          cat src/custom.txt

      - name: Write app name config
        shell: bash
        run: |
          if [ -n "${APP_NAME}" ]; then
            sed -i "s/RustDesk/${APP_NAME}/g" src/lang/en.rs || true
            sed -i "s/\"RustDesk\"/\"${APP_NAME}\"/g" Cargo.toml || true
          fi

      - name: Report status - building
        shell: bash
        run: |
          curl -s -X POST "${GENURL_VALUE}/admin/client-build/webhook/update?token=${BUILD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"progress":"Компилируется Rust (~20-30 мин)..."}'

      - name: Build RustDesk
        shell: cmd
        run: |
          python3 res\inline-sciter.py
          cargo build --release --features inline

      - name: Create installer
        shell: bash
        run: |
          FNAME="${FILE_NAME:-rustdesk-client}"
          cp target/release/rustdesk.exe "${FNAME}.exe"

          # Basic NSIS installer if available
          if command -v makensis &> /dev/null; then
            makensis /DAPP_NAME="${APP_NAME:-RustDesk}" \
                     /DCOMPANY_NAME="${COMPANY_NAME}" \
                     /DFILE_NAME="${FNAME}" \
                     res/nsis/installer.nsi || true
          fi

          ls -la *.exe 2>/dev/null || true

      - name: Report status - uploading
        shell: bash
        run: |
          curl -s -X POST "${GENURL_VALUE}/admin/client-build/webhook/update?token=${BUILD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"progress":"Сборка завершена, загружается на сервер..."}'

      - name: Upload binary to Everty Desk
        shell: bash
        run: |
          FNAME="${FILE_NAME:-rustdesk-client}"
          EXE_FILE="${FNAME}.exe"

          if [ -f "${EXE_FILE}" ]; then
            curl -s -f -X POST \
              "${GENURL_VALUE}/admin/client-build/webhook/save?token=${BUILD_TOKEN}" \
              -F "file=@${EXE_FILE}"
            echo "Uploaded ${EXE_FILE}"
          else
            echo "EXE not found: ${EXE_FILE}"
            # try target/release/rustdesk.exe
            if [ -f "target/release/rustdesk.exe" ]; then
              curl -s -f -X POST \
                "${GENURL_VALUE}/admin/client-build/webhook/save?token=${BUILD_TOKEN}" \
                -F "file=@target/release/rustdesk.exe"
            fi
          fi

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          curl -s -X POST "${GENURL_VALUE}/admin/client-build/webhook/update?token=${BUILD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failed\",\"message\":\"Сборка упала на шаге: ${{ github.job }}. Runner: ${{ runner.name }}\"}"
